name: Deploy Hisense Vidaa patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-hisense-vidaa-patch.yml
      - scripts/deploy-hisense-patch.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Check out patch script
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch Stremio Hisense bundles
        shell: bash
        run: |
          set -euo pipefail
          node source/scripts/deploy-hisense-patch.js site/hisense/1.10.0
          node --check site/hisense/1.10.0/main.js
          node --check site/hisense/1.10.0/search.chunk.js
          node --check site/hisense/1.10.0/player.chunk.js

      - name: Commit Pages update
        shell: bash
        run: |
          set -euo pipefail
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hisense/1.10.0/index.html hisense/1.10.0/main.js hisense/1.10.0/player.chunk.js hisense/1.10.0/search.chunk.js
          if git diff --cached --quiet; then
            echo "No Pages changes to commit."
          else
            git commit -m "Deploy Hisense Vidaa audio and search fixes"
            git push origin gh-pages
          fi
